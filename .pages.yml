# Pages CMS 設定
# ドキュメント: https://pagescms.org/docs/configuration
# 編集画面は https://app.pagescms.org （GitHub でログインし、このリポジトリを選択）。
# 保存すると main にコミットされ、Cloudflare Pages が再デプロイする。

media:
  - name: images
    label: 画像
    input: public/images
    output: /images
    categories: [image]
  - name: downloads
    label: 配布資料
    input: public/downloads
    output: /downloads

content:
  - name: members
    label: メンバー
    type: file
    path: src/data/members.json
    format: json
    fields:
      - name: members
        label: メンバー一覧
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{name}"
        fields:
          - name: name
            label: 氏名
            type: string
            required: true
          - name: nameEn
            label: ローマ字
            type: string
          - name: group
            label: 区分
            description: 学年の繰り上げはここを変更します。卒業したメンバーは右上のゴミ箱で削除します。区分内の表示順は一覧の並び順（左のつまみで並べ替え）です
            type: select
            required: true
            options:
              values:
                - { name: faculty, label: 教員 }
                - { name: phd-social, label: 博士課程（社会人） }
                - { name: phd4, label: 博士課程4年 }
                - { name: phd3, label: 博士課程3年 }
                - { name: phd2, label: 博士課程2年 }
                - { name: phd1, label: 博士課程1年 }
                - { name: year6, label: 6年生 }
                - { name: year5, label: 5年生 }
                - { name: year4, label: 4年生 }
          - name: role
            label: 役職
            description: 教員のみ（教授・講師・助教など）
            type: string
          - name: degree
            label: 学位
            type: string
          - name: profileUrl
            label: プロフィールURL
            type: string

  - name: training
    label: 実務実習資料
    type: file
    path: src/data/training.json
    format: json
    fields:
      - name: intro
        label: ページ冒頭の説明文
        type: text
      - name: files
        label: 資料一覧
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{title}"
        fields:
          - name: title
            label: 資料名
            type: string
            required: true
          - name: file
            label: ファイル
            type: file
            required: true
            options:
              media: downloads
          - name: year
            label: 年度
            type: number
          - name: published
            label: 公開する
            description: オフにすると一覧に表示されません（ファイル自体は URL を知っていれば取得できます）
            type: boolean
            default: true

  - name: publications
    label: 業績
    path: src/content/publications
    type: collection
    fields:
      - name: title
        label: タイトル
        type: string
        required: true
      - name: description
        label: 一覧に表示する概要
        type: string
        required: true
      - name: order
        label: 表示順
        description: 業績一覧での並び順（小さいほど先）
        type: number
        required: true
      - name: oldUrl
        label: 旧サイトURL
        type: string
        readonly: true
      - name: body
        label: 本文
        description: 年度は見出し（H3）、業績は1件ずつ箇条書きにします。新しい業績は該当年度の見出しの下の先頭に追加してください
        type: rich-text

  - name: news
    label: お知らせ
    path: src/content/news
    type: collection
    fields:
      - name: title
        label: タイトル
        type: string
        required: true
      - name: description
        label: 概要
        type: string
      - name: date
        label: 日付
        type: date
        required: true
      - name: draft
        label: 下書き
        type: boolean
        default: false
      - name: body
        label: 本文
        type: rich-text

  - name: events
    label: 行事
    path: src/content/events
    type: collection
    fields:
      - name: title
        label: タイトル
        type: string
        required: true
      - name: year
        label: 年度
        type: number
        required: true
      - name: description
        label: 概要
        type: string
      - name: cover
        label: カバー画像パス
        type: string
      - name: body
        label: 本文
        type: rich-text
